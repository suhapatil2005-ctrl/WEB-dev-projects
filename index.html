<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1><b>Application form</b></h1>

        <label for="fname"></label>First name:   </label>
        <input type="text" name="fname" id="fname">

        <label for="lname">Last Name: </label>
        <input type="text" id="lname" name="lname">
        <br>
        <br>

        <label for="DOB">Date of Birth: </label>
        <input type="date" name="DOB" id="DOB">

        <label for="age">AGE: </label>
        <input type="number" name="AGE" id="AGE">
        <br>
        <br>

        <label for="gender">Gender: </label>
        <input type="radio" id="Male" name="gender">
        <label for="Male">Male</label>
        <input type="radio" id="Female" name="gender">
        <label for="Female">Female</label>
        <input type="radio" id="other" name="other">
        <label for="Other">Other</label>
        <br>
        <br>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email">
        <br>
        <br>

        <label for="position">Position available: </label>
        <input type="radio" id="position1">
        <label for="position1">Junior developer</label>
        <input type="radio" id="position2">
        <label for="position2">Mid-level developer</label>
        <input type="radio" id="position3">
        <label for="position3">Senior</label>

        <br>
        <br>
        <label for="programming">Programming languages: </label>
        <input type="checkbox" id="programming1">
        <label for="programming1">Java</label>
        <input type="checkbox" id="programming2">
        <label for="programming2">Javascript</label>
        <input type="radio" id="programming3">
        <label for="programming3">Python</label>

        <br>
        <br>


        <label for="password">Password: </label>
        <input type="password" name="password" id="password">
        <label for="Cpassword"> confirm Password: </label>
        <input type="password" name="Cpassword" id="Cpassword">
        <br>
        <br>

        <input type="submit" value="Submit">
        <input type="reset" value="reset">




    </form>
</body>
</html>
