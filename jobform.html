<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <p><h2><b>Job Application</b></h2></p><br>
        <label for="fullname">Full Name: </label><br>
        <input type="text" id="fullname"><br>

        <label for="email">Email: </label><br>
        <input type="email" id="email"><br>

        <label for="phone">Phone: </label><br>
        <input type="tel" id="phone"><br>

        <label for="resume">Resume: </label><br>
        <input type="file" id="resume"><br><br>

        <label for="experience">Experience: </label><br>
        <input type="number" id="experience"><br><br>
         
        <fieldset>
        <legend>Skills</legend>
        <input type="checkbox" id="skill1">
        <label for="skill1">HTML</label><br>

        <input type="checkbox" id="skill2">
        <label for="skill2">Java</label><br>

        <input type="checkbox" id="skill3">
        <label for="skill3">Python</label></fieldset>
        <br>
        <br>

        <fieldset>
            <legend>Background</legend>
        <select >
            <option value="school">High School</option>
            <option value="graduation">Graduation</option>
            <option value="master">Master</option>
        </select></fieldset>
        <br>
        <br>

        <p><h3>Availbility: </h3></p>

        <label for="fulltime"><input type="radio" id="fullname" name="availbility" value="full-time">Full time</label><br>
        <label for="parttime"><input type="radio" id="parttime" name="availbility" value="part-time">Part time</label><br><br>

        <p><h3>Additional comments:</h3></p>
        <textarea name="comments" id="comments" rows="10" cols="70"></textarea><br><br>

        <input type="submit" value="Submit">




    </form>
</body>
</html>
